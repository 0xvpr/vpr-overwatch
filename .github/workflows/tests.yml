name: Run Tests

on:
  pull_request:
    branches: [ "main" ]

jobs:
  ubuntu_latest_build_cmake_gcc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Run Tests (Ubuntu GCC)
        run: make tests

  windows_latest_build_cmake_msvc:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Run Tests (Windows MSVC++)
        run: make tests

  mac_latest_build_cmake_apple_clang:
    runs-on: macOS-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Run Tests (MacOS Apple Xclang++)
        run: make tests
